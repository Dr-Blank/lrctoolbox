[project]
name = "lrctoolbox"
version = "1.2.0"
description = "toolkit for working with lrc files"
authors = [
  { name = "Dr-Blank", email = "64108942+Dr-Blank@users.noreply.github.com" },
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENCE"]
requires-python = ">=3.11"
dependencies = []
keywords = [
  "lrc",
  "lyrics",
  "pylrc",
  "synced lyrics",
  "karaoke",
  "music",
  "file",
  "parser",
  "editor",
  "converter",
]
classifiers = [
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: Text Processing",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Dr-Blank/lrctoolbox"

[dependency-groups]
dev = [
  "pytest>=7.4.2,<8",
  "pre-commit>=3.4.0,<4",
  "pytest-cov>=4.1.0,<5",
  "mypy>=1.5.1,<2",
  "ruff>=0.17.1,<0.18",
]
docs = [
  "sphinx-rtd-theme>=1.3.0,<2",
  "nbsphinx>=0.9.3,<0.10",
  "ipython>=8.17.2,<9",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "PL",  # pylint
  "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"] # magic values are fine in assertions

[tool.mypy]
packages = ["lrctoolbox"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
pretty = true
