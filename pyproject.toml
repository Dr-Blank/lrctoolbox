[project]
name = "lrctoolbox"
version = "1.2.0"
description = "toolkit for working with lrc files"
authors = [
  { name = "Dr-Blank", email = "64108942+Dr-Blank@users.noreply.github.com" },
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENCE"]
requires-python = ">=3.10"
dependencies = []
keywords = [
  "lrc",
  "lyrics",
  "pylrc",
  "synced lyrics",
  "karaoke",
  "music",
  "file",
  "parser",
  "editor",
  "converter",
]
classifiers = [
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: Text Processing",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
]

[project.urls]
Repository = "https://github.com/Dr-Blank/lrctoolbox"

[dependency-groups]
dev = [
  "pylint>=2.17.6,<3",
  "pytest>=7.4.2,<8",
  "black>=23.9.1,<24",
  "pre-commit>=3.4.0,<4",
  "pytest-cov>=4.1.0,<5",
  "flake8>=6.1.0,<7",
  "tox>=4.11.3,<5",
  "wrapt>=1.15.0,<2",
  "dill>=0.3.7,<0.4",
  "mypy>=1.5.1,<2",
]
docs = [
  "sphinx-rtd-theme>=1.3.0,<2",
  "nbsphinx>=0.9.3,<0.10",
  "ipython>=8.17.2,<9",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.black] 
line-length = 79
preview = true
