# Docs:
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
# https://docs.readthedocs.com/platform/stable/build-customization.html
#
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
