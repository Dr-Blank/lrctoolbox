# The file name is registered as the trusted publisher on PyPI; renaming it
# breaks publishing until the publisher there is updated too.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.2.3"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ci:
    name: CI
    # id-token is only for the coverage job, which is skipped here, but a
    # called workflow cannot ask for more than its caller grants
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tests.yaml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  build:
    name: Verify and build
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
      - name: Verify the tag matches the package version
        run: |
          version="v$(uv version --short)"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lrctoolbox
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Groups the commits since the previous tag by Conventional Commits
      # type. gh release create prepends this to GitHub's generated notes.
      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail

          if previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null)"; then
            range="${previous}..${TAG}"
          else
            previous=""
            range="${TAG}"
          fi

          declare -A sections=()
          breaking=""

          while IFS=$'\t' read -r sha subject; do
            [ -n "$sha" ] || continue
            short="${sha:0:7}"
            if [[ "$subject" =~ ^([a-z]+)(\(([^\)]+)\))?(!)?:[[:space:]]+(.+)$ ]]; then
              type="${BASH_REMATCH[1]}"
              scope="${BASH_REMATCH[3]}"
              bang="${BASH_REMATCH[4]}"
              description="${BASH_REMATCH[5]}"
            else
              type="other"
              scope=""
              bang=""
              description="$subject"
            fi

            # The version bump commit carries no change of its own.
            if [ "$type" = "chore" ] && { [ "$scope" = "release" ] || [[ "$description" == release\ * ]]; }; then
              continue
            fi

            line="- ${scope:+**${scope}:** }${description} (${short})"
            if [ -n "$bang" ] || grep -q '^BREAKING[ -]CHANGE:' <<<"$(git log -1 --format=%B "$sha")"; then
              breaking+="${line}"$'\n'
              continue
            fi

            case "$type" in
              feat) key="feat" ;;
              fix) key="fix" ;;
              perf) key="perf" ;;
              refactor) key="refactor" ;;
              docs) key="docs" ;;
              build | ci | chore | style | test) key="maintenance" ;;
              *) key="other" ;;
            esac
            sections[$key]+="${line}"$'\n'
          done < <(git log --no-merges --format='%H%x09%s' "$range")

          print_section() {
            local title="$1" body="$2"
            if [ -n "$body" ]; then
              printf '### %s\n\n%s\n' "$title" "$body"
            fi
          }

          {
            if [ -n "$previous" ]; then
              printf '## Commits since %s\n\n' "$previous"
            else
              printf '## Commits\n\n'
            fi
            if [ ${#sections[@]} -eq 0 ] && [ -z "$breaking" ]; then
              printf 'No changes besides the version bump.\n'
            fi
            print_section "Breaking changes" "$breaking"
            print_section "Features" "${sections[feat]:-}"
            print_section "Fixes" "${sections[fix]:-}"
            print_section "Performance" "${sections[perf]:-}"
            print_section "Refactoring" "${sections[refactor]:-}"
            print_section "Documentation" "${sections[docs]:-}"
            print_section "Maintenance" "${sections[maintenance]:-}"
            print_section "Other changes" "${sections[other]:-}"
          } > "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag
