name: Test

on:
  workflow_dispatch: ~
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs the full suite on the tag before publishing.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run tests
        run: uv run --locked pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: ruff check
        run: uv run --locked ruff check --output-format=github .
      - name: ruff format
        run: uv run --locked ruff format --check .
      - name: mypy
        run: uv run --locked mypy

  coverage:
    name: Coverage report
    needs: test
    # main is already reported; a release run only gates on the tests
    if: inputs.ref == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Run tests with coverage
        run: uv run --locked pytest --cov=lrctoolbox --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true
